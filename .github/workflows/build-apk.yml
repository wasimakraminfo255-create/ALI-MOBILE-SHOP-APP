name: Build ALI MOBILE SHOP APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
          cache-provider: basic

      - name: Extract Android project
        run: |
          unzip -q ALI_MOBILE_SHOP_ANDROID_PROJECT.zip -d project
          ROOT=$(find project -name settings.gradle -o -name settings.gradle.kts | head -1)
          ROOT=$(dirname "$ROOT")
          echo "PROJECT_ROOT=$ROOT" >> $GITHUB_ENV

      - name: Build APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALI-MOBILE-SHOP-APK
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/app-debug.apk
